name: haktramv-ml
services:
  ml:
    build:
      context: .
      target: runtime
    image: haktramv-ml:1.0.0
    ports:
      - "127.0.0.1:8088:8000"
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
